<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Searenity on Lummi</title>
  <meta name="description" content="Projects and stories from Searenity on Lummi, on Lummi Island, Washington.">
  <style>
    :root { --bg: #f4f1ea; --ink: #23333a; --muted: #5d6e73; --accent: #2f6f7e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #162227; --ink: #e8ece9; --muted: #a3b2b4; --accent: #7fbfcc; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; padding: 24px 16px; }
    main { max-width: 34rem; text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 3.25rem); font-weight: normal; margin: 0 0 0.5rem; letter-spacing: 0.01em; }
    .wave { color: var(--accent); font-size: 1.5rem; margin: 0 0 1.5rem; }
    p { color: var(--muted); font-size: 1.15rem; line-height: 1.6; margin: 0; }
    .credit { font-size: 0.95rem; font-style: italic; margin-top: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Searenity on Lummi</h1>
    <p class="wave" aria-hidden="true">~ ~ ~</p>
    <p>Lummi Island, Washington. Stories and projects coming soon.</p>
    <p class="credit">Published by Loeppky</p>
  </main>
</body>
</html>
