# Publishes the site/ folder to GitHub Pages (https://searenityonlummi.com) on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check images have no hidden location or camera data
        run: python3 tools/strip-metadata.py --check site
      - name: Check no file is too large for the site
        run: |
          big=$(find site -type f -size +25M)
          if [ -n "$big" ]; then echo "Files over 25 MB (put videos on YouTube instead):"; echo "$big"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
